name: Deploy Litfaß to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fast Syntax Sanity Check
        run: |
          node -e '
            global.window = {};
            require("./data/events.js");
            if (!window.LITFASS_DATA || !Array.isArray(window.LITFASS_DATA.events)) {
              console.error("Invalid LITFASS_DATA structure");
              process.exit(1);
            }
            console.log(`Verified ${window.LITFASS_DATA.events.length} events ready for deployment.`);
          '

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
